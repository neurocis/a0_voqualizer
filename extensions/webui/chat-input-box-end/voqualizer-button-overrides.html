<!--
  A0 Voqualizer in-GUI button overrides.

  When this plugin is enabled, this extension is injected into the standard
  chat-input bottom-actions area. It intercepts pointer and keyboard events on
  A0's existing #microphone-button (Mic) and the speech progress-bar Stop
  Speech control (treated as Speaker UI), and routes them through the
  Alpine.store('voqualizer') state machine for Conversational Mode and PTT.

  When the plugin is not installed/enabled, this extension is never loaded by
  A0's plugin manifest, so original A0 mic/speaker behavior remains untouched.
-->
<div
  x-data="a0VoqualizerButtonOverrides()"
  x-init="init()"
  data-a0-voqualizer-button-overrides="1"
  style="display:none;"
></div>

<style>
  /* Speaker dim cue when TTS is toggled off per-context. */
  .voqualizer-tts-off { opacity: 0.45 !important; filter: grayscale(0.6); }
  .voqualizer-active { box-shadow: inset 0 0 0 2px var(--color-accent, #6cf) !important; }
  .voqualizer-ptt    { box-shadow: inset 0 0 0 2px #ff3b30 !important; }
  .voqualizer-connecting { animation: voqualizerPulse 1s infinite ease-in-out; }
  @keyframes voqualizerPulse { 0%,100%{opacity:.7} 50%{opacity:1} }
</style>

<script type="module">
  import { registerVoqualizerStore, TAP_HOLD_THRESHOLD_MS, STATE_CONVERSATIONAL, STATE_PTT_ACTIVE, STATE_CONNECTING, STATE_ERROR } from '/plugins/a0_voqualizer/webui/conversation-mode.js';

  // Ensure Alpine.store('voqualizer') exists before the extension wires up
  // capture-phase listeners. This is idempotent.
  registerVoqualizerStore();

  window.a0VoqualizerButtonOverrides = function () {
    return {
      _bound: false,
      _holdTimer: 0,
      _holdActive: false,
      _pointerDownTs: 0,
      init() {
        // Try to wire up immediately; if buttons are not in DOM yet (Alpine load
        // order or modal mounting), retry on next frame for up to ~2 s.
        let attempts = 0;
        const tryWire = () => {
          attempts += 1;
          const ok = this._wireUp();
          if (!ok && attempts < 30) {
            requestAnimationFrame(tryWire);
          }
        };
        tryWire();
      },
      _wireUp() {
        if (this._bound) return true;
        const micBtn = document.getElementById('microphone-button');
        const stopSpeech = document.getElementById('stop-speech');
        if (!micBtn) return false;
        const store = () => window.Alpine && window.Alpine.store('voqualizer');

        // --- Mic: pointerdown/up/cancel with tap vs hold (>= 250 ms) ---
        const onPointerDown = (event) => {
          event.stopImmediatePropagation();
          event.preventDefault();
          this._pointerDownTs = Date.now();
          this._holdActive = false;
          this._holdTimer = setTimeout(async () => {
            this._holdActive = true;
            micBtn.classList.add('voqualizer-ptt');
            try { await store().onHoldStart(); } catch (e) { console.error('[voqualizer] onHoldStart', e); }
          }, TAP_HOLD_THRESHOLD_MS);
        };
        const onPointerUp = async (event) => {
          event.stopImmediatePropagation();
          event.preventDefault();
          clearTimeout(this._holdTimer);
          this._holdTimer = 0;
          const elapsed = Date.now() - this._pointerDownTs;
          micBtn.classList.remove('voqualizer-ptt');
          if (this._holdActive || elapsed >= TAP_HOLD_THRESHOLD_MS) {
            try { await store().onHoldEnd(); } catch (e) { console.error('[voqualizer] onHoldEnd', e); }
          } else {
            try { await store().onTap(); } catch (e) { console.error('[voqualizer] onTap', e); }
          }
        };
        const onPointerCancel = (event) => {
          clearTimeout(this._holdTimer);
          this._holdTimer = 0;
          micBtn.classList.remove('voqualizer-ptt');
        };
        const onKey = async (event) => {
          if (event.key !== ' ' && event.key !== 'Enter') return;
          event.stopImmediatePropagation();
          if (event.type === 'keydown' && !event.repeat) {
            onPointerDown(event);
          } else if (event.type === 'keyup') {
            onPointerUp(event);
          }
        };
        // Use capture-phase so we run before A0's own @click bindings.
        micBtn.addEventListener('pointerdown', onPointerDown, { capture: true });
        micBtn.addEventListener('pointerup', onPointerUp, { capture: true });
        micBtn.addEventListener('pointercancel', onPointerCancel, { capture: true });
        micBtn.addEventListener('pointerleave', onPointerCancel, { capture: true });
        micBtn.addEventListener('keydown', onKey, { capture: true });
        micBtn.addEventListener('keyup', onKey, { capture: true });

        // --- Speaker (use Stop Speech control if present as the on-screen Speaker handle). ---
        if (stopSpeech) {
          const onSpeakerClick = (event) => {
            event.stopImmediatePropagation();
            event.preventDefault();
            const s = store();
            s && s.toggleTts();
            stopSpeech.classList.toggle('voqualizer-tts-off', !!(s && !s.isTtsEnabled()));
            stopSpeech.setAttribute('aria-pressed', String(s ? s.isTtsEnabled() : true));
          };
          stopSpeech.addEventListener('click', onSpeakerClick, { capture: true });
          // Reflect current state at startup.
          const s = store();
          stopSpeech.classList.toggle('voqualizer-tts-off', !!(s && !s.isTtsEnabled()));
          stopSpeech.setAttribute('aria-pressed', String(s ? s.isTtsEnabled() : true));
        }

        // Periodic visual state sync.
        setInterval(() => {
          const s = store();
          if (!s) return;
          micBtn.classList.toggle('voqualizer-active', s.state === STATE_CONVERSATIONAL);
          micBtn.classList.toggle('voqualizer-ptt', s.state === STATE_PTT_ACTIVE);
          micBtn.classList.toggle('voqualizer-connecting', s.state === STATE_CONNECTING);
          micBtn.setAttribute('aria-pressed', String(s.state === STATE_CONVERSATIONAL || s.state === STATE_PTT_ACTIVE));
          if (stopSpeech) stopSpeech.classList.toggle('voqualizer-tts-off', !s.isTtsEnabled());
        }, 250);

        this._bound = true;
        return true;
      },
    };
  };
</script>
