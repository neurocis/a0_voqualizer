<!--
  A0 Voqualizer dedicated chat-input buttons.

  Renders two NEW circular buttons at the far right of the chat-input
  action row. Does NOT touch A0's existing native
  microphone/speaker controls.

  Buttons:
    #voqualizer-speaker-button — toggles Voqualizer TTS for the current
        context. Dim cue (.voqualizer-tts-off) when off. Emits
        voqualizer_control { action: 'set_tts_enabled', enabled } live.
    #voqualizer-mic-button     — quick-tap (<250 ms) toggles Conversational
        Mode, click-hold (>=250 ms) is push-to-talk and sends an explicit
        is_final:true end-of-utterance frame on release. PTT overlays an
        already-active conversational session.

  Mounted at extension breakpoint `chat-input-box-end`, which lives inside
  the chat-input row immediately after the existing chat-buttons-wrapper, so
  the new controls appear at the far right edge (placement option b).
-->
<div
  x-data="a0VoqualizerButtons()"
  x-init="init()"
  data-a0-voqualizer-buttons="1"
  class="voqualizer-buttons-row"
>
  <button
    type="button"
    id="voqualizer-speaker-button"
    class="chat-button voqualizer-button voqualizer-speaker"
    aria-label="Voqualizer TTS is on. Click to mute TTS for this chat."
    title="Voqualizer TTS is on. Click to mute TTS for this chat."
    aria-pressed="true"
    @click="onSpeakerClick($event)"
  >
    <span class="material-symbols-outlined" aria-hidden="true">graphic_eq</span>
    <span class="voqualizer-button-badge" aria-hidden="true">V</span>
  </button>
  <button
    type="button"
    id="voqualizer-mic-button"
    class="chat-button voqualizer-button voqualizer-mic voqualizer-idle"
    aria-label="Voqualizer mic off. Tap for conversation. Hold for push-to-talk."
    title="Voqualizer mic off. Tap for conversation. Hold for push-to-talk."
    aria-pressed="false"
    @pointerdown="onPointerDown($event)"
    @pointerup="onPointerUp($event)"
    @pointercancel="onPointerCancel($event)"
    @pointerleave="onPointerCancel($event)"
    @keydown="onKey($event)"
    @keyup="onKey($event)"
  >
    <span class="voqualizer-mic-vu" aria-hidden="true"></span>
    <span class="material-symbols-outlined" aria-hidden="true">mic</span>
    <span class="voqualizer-button-ring" aria-hidden="true"></span>
  </button>
</div>

<style>
  .voqualizer-buttons-row {
    display: inline-flex;
    align-items: center;
    gap: var(--spacing-xs, 6px);
    margin-left: auto;
    padding-left: var(--spacing-xs, 6px);
    min-width: 0;
  }
  .voqualizer-button {
    position: relative;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--color-text);
    background: transparent;
    border: 1px solid var(--color-border, rgba(255,255,255,0.15));
    transition: transform 0.08s ease, box-shadow 0.15s ease, opacity 0.15s ease, background 0.15s ease;
  }
  .voqualizer-button:hover { transform: translateY(-1px); }
  .voqualizer-button:focus-visible {
    outline: 2px solid var(--color-accent, #6cf);
    outline-offset: 2px;
  }
  .voqualizer-button-badge {
    position: absolute;
    right: -2px;
    bottom: -2px;
    font-size: 9px;
    font-weight: 700;
    line-height: 1;
    padding: 2px 3px;
    border-radius: 4px;
    background: var(--color-accent, #6cf);
    color: #000;
    pointer-events: none;
  }
  .voqualizer-button-ring {
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    border: 1.5px dashed var(--color-accent, #6cf);
    opacity: 0.55;
    pointer-events: none;
  }
  .voqualizer-mic .material-symbols-outlined,
  .voqualizer-mic .voqualizer-button-ring {
    z-index: 2;
  }
  .voqualizer-mic-vu {
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% calc(100% - 8px),
        rgba(46, 204, 113, calc(0.35 + (0.55 * var(--voqualizer-vu-level, 0)))) 0%,
        rgba(46, 204, 113, calc(0.24 + (0.42 * var(--voqualizer-vu-level, 0)))) calc(32% + (42% * var(--voqualizer-vu-level, 0))),
        transparent calc(34% + (42% * var(--voqualizer-vu-level, 0)))),
      linear-gradient(0deg,
        rgba(46, 204, 113, 0.92) 0%,
        rgba(46, 204, 113, 0.58) calc(100% * var(--voqualizer-vu-level, 0)),
        transparent calc(100% * var(--voqualizer-vu-level, 0)));
    opacity: var(--voqualizer-vu-opacity, 0);
    transform: scale(calc(0.84 + (0.18 * var(--voqualizer-vu-level, 0))));
    transform-origin: center;
    transition: transform 65ms linear, opacity 100ms ease, filter 65ms linear;
    filter: drop-shadow(0 0 calc(3px + (8px * var(--voqualizer-vu-level, 0))) rgba(46, 204, 113, 0.95));
    pointer-events: none;
    z-index: 1;
  }
  .voqualizer-mic.voqualizer-active {
    box-shadow:
      0 0 0 2px rgba(46, 204, 113, 1) inset,
      0 0 calc(7px + (12px * var(--voqualizer-vu-level, 0))) rgba(46, 204, 113, 0.62);
  }
  .voqualizer-mic.voqualizer-ptt .voqualizer-mic-vu {
    background:
      radial-gradient(circle at 50% calc(100% - 8px),
        rgba(255, 149, 0, calc(0.40 + (0.52 * var(--voqualizer-vu-level, 0)))) 0%,
        rgba(255, 149, 0, calc(0.28 + (0.42 * var(--voqualizer-vu-level, 0)))) calc(32% + (42% * var(--voqualizer-vu-level, 0))),
        transparent calc(34% + (42% * var(--voqualizer-vu-level, 0)))),
      linear-gradient(0deg,
        rgba(255, 149, 0, 0.95) 0%,
        rgba(255, 149, 0, 0.62) calc(100% * var(--voqualizer-vu-level, 0)),
        transparent calc(100% * var(--voqualizer-vu-level, 0)));
    filter: drop-shadow(0 0 calc(4px + (9px * var(--voqualizer-vu-level, 0))) rgba(255, 149, 0, 0.95));
  }
  .voqualizer-mic.voqualizer-ptt {
    box-shadow:
      0 0 0 2px #ff9500 inset,
      0 0 calc(8px + (13px * var(--voqualizer-vu-level, 0))) rgba(255, 149, 0, 0.68);
  }
  .voqualizer-mic.voqualizer-vu-clipped .voqualizer-mic-vu {
    background: radial-gradient(circle, rgba(255, 59, 48, 0.96), rgba(255, 59, 48, 0.44), transparent 76%);
    filter: drop-shadow(0 0 12px rgba(255, 59, 48, 0.95));
  }
  .voqualizer-mic.voqualizer-error .voqualizer-mic-vu {
    background: radial-gradient(circle, rgba(255, 59, 48, 0.70), rgba(255, 59, 48, 0.28), transparent 76%);
  }
  .voqualizer-idle {
    border-color: var(--color-border, rgba(255,255,255,0.15));
    background: rgba(127,127,127,0.04);
  }
  .voqualizer-tts-off {
    opacity: 0.45 !important;
    filter: grayscale(0.6);
  }
  .voqualizer-button.voqualizer-active:not(.voqualizer-mic) {
    box-shadow: 0 0 0 2px rgba(46, 204, 113, 0.95) inset, 0 0 8px rgba(46, 204, 113, 0.35);
    background: rgba(46, 204, 113, 0.12);
  }
  .voqualizer-button.voqualizer-ptt:not(.voqualizer-mic) {
    box-shadow: 0 0 0 2px #ff9500 inset, 0 0 10px rgba(255, 149, 0, 0.40);
    background: rgba(255, 149, 0, 0.14);
  }
  .voqualizer-connecting { animation: voqualizerPulse 1s infinite ease-in-out; }
  .voqualizer-error {
    box-shadow: 0 0 0 2px #ff3b30 inset;
    background: rgba(255, 59, 48, 0.14);
  }
  @keyframes voqualizerPulse { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }
</style>

<script type="module">
  import {
    registerVoqualizerStore,
    TAP_HOLD_THRESHOLD_MS,
    STATE_CONVERSATIONAL,
    STATE_PTT_ACTIVE,
    STATE_CONNECTING,
    STATE_STOPPING,
    STATE_ERROR,
  } from '/plugins/a0_voqualizer/webui/conversation-mode.js';

  registerVoqualizerStore();

  window.a0VoqualizerButtons = function () {
    return {
      _holdTimer: 0,
      _holdActive: false,
      _pointerDownTs: 0,
      _keyDownActive: false,
      _syncTimer: 0,
      _vqStore() {
        return (window.Alpine && window.Alpine.store && window.Alpine.store('voqualizer')) || null;
      },
      init() {
        const speaker = document.getElementById('voqualizer-speaker-button');
        const mic = document.getElementById('voqualizer-mic-button');
        const sync = () => {
          const s = this._vqStore();
          if (!s) return;
          const ttsOff = !s.isTtsEnabled();
          const micLabel = this.micLabel(s);
          const speakerLabel = this.speakerLabel(ttsOff);
          const visualClass = this.visualClass(s);
          if (speaker) {
            speaker.classList.toggle('voqualizer-tts-off', ttsOff);
            speaker.setAttribute('aria-pressed', String(!ttsOff));
            speaker.setAttribute('aria-label', speakerLabel);
            speaker.setAttribute('title', speakerLabel);
          }
          if (mic) {
            mic.classList.toggle('voqualizer-idle', visualClass === 'voqualizer-idle');
            mic.classList.toggle('voqualizer-active', visualClass === 'voqualizer-active');
            mic.classList.toggle('voqualizer-ptt', visualClass === 'voqualizer-ptt');
            mic.classList.toggle('voqualizer-connecting', visualClass === 'voqualizer-connecting');
            mic.classList.toggle('voqualizer-error', visualClass === 'voqualizer-error');
            const vuLevel = Math.max(0, Math.min(1, Number(s.micVuLevel || 0) || 0));
            const vuActive = (s.state === STATE_CONVERSATIONAL || s.state === STATE_PTT_ACTIVE) && vuLevel > 0.01;
            mic.style.setProperty('--voqualizer-vu-level', String(vuLevel));
            mic.style.setProperty('--voqualizer-vu-opacity', vuActive ? '1' : '0');
            mic.classList.toggle('voqualizer-vu-clipped', !!s.micVuClipped);
            mic.setAttribute('data-voqualizer-vu-level', vuLevel.toFixed(2));
            mic.setAttribute('aria-pressed', String(s.state === STATE_CONVERSATIONAL || s.state === STATE_PTT_ACTIVE));
            mic.setAttribute('aria-label', micLabel);
            mic.setAttribute('title', `${micLabel} Last: ${s.lastTransitionReason || 'n/a'} / ${s.lastConnectPhase || 'n/a'}`);
          }
        };
        sync();
        this._syncTimer = setInterval(sync, 250);
      },
      speakerLabel(ttsOff) {
        return ttsOff
          ? 'Voqualizer TTS is muted. Click to enable TTS for this chat.'
          : 'Voqualizer TTS is on. Click to mute TTS for this chat.';
      },
      micLabel(s) {
        if (s.state === STATE_CONNECTING) return 'Voqualizer connecting…';
        if (s.state === STATE_STOPPING) return 'Voqualizer stopping…';
        if (s.state === STATE_CONVERSATIONAL) return 'Voqualizer listening. Tap to stop. Hold for push-to-talk finalization.';
        if (s.state === STATE_PTT_ACTIVE) return 'Voqualizer push-to-talk active. Release to send final.';
        if (s.state === STATE_ERROR) return 'Voqualizer error. Tap to retry.';
        return 'Voqualizer mic off. Tap for conversation. Hold for push-to-talk.';
      },
      visualClass(s) {
        if (s.state === STATE_CONNECTING || s.state === STATE_STOPPING) return 'voqualizer-connecting';
        if (s.state === STATE_CONVERSATIONAL) return 'voqualizer-active';
        if (s.state === STATE_PTT_ACTIVE) return 'voqualizer-ptt';
        if (s.state === STATE_ERROR) return 'voqualizer-error';
        return 'voqualizer-idle';
      },
      onSpeakerClick(event) {
        event.preventDefault();
        const s = this._vqStore();
        if (!s) return;
        const wasOn = s.isTtsEnabled();
        s.toggleTts();
      },
      onPointerDown(event) {
        if (event.button !== undefined && event.button !== 0) return;
        event.preventDefault();
        this._pointerDownTs = Date.now();
        this._holdActive = false;
        this._holdTimer = setTimeout(async () => {
          this._holdActive = true;
          try { await this._vqStore()?.onHoldStart(); } catch (e) { console.error('[voqualizer] onHoldStart', e); }
        }, TAP_HOLD_THRESHOLD_MS);
      },
      async onPointerUp(event) {
        event.preventDefault();
        clearTimeout(this._holdTimer);
        this._holdTimer = 0;
        const elapsed = Date.now() - this._pointerDownTs;
        const s = this._vqStore();
        if (this._holdActive || elapsed >= TAP_HOLD_THRESHOLD_MS) {
          try { await s?.onHoldEnd(); } catch (e) { console.error('[voqualizer] onHoldEnd', e); }
        } else {
          const wasConversational = s && s.state === STATE_CONVERSATIONAL;
          try { await s?.onTap(); } catch (e) { console.error('[voqualizer] onTap', e); }
        }
        this._holdActive = false;
      },
      onPointerCancel(event) {
        clearTimeout(this._holdTimer);
        this._holdTimer = 0;
        this._holdActive = false;
      },
      async onKey(event) {
        if (event.key !== ' ' && event.key !== 'Enter') return;
        event.preventDefault();
        if (event.type === 'keydown') {
          if (event.repeat) return;
          this._keyDownActive = true;
          this.onPointerDown({ button: 0, preventDefault() {} });
        } else if (event.type === 'keyup' && this._keyDownActive) {
          this._keyDownActive = false;
          await this.onPointerUp({ preventDefault() {} });
        }
      },
    };
  };
</script>
