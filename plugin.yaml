name: a0_voqualizer
title: A0 Voqualizer
description: >-
  Breaking Wyoming-protocol voice interface runtime for Agent Zero. Exposes one
  or more Wyoming-compatible TCP interfaces, each mapped 1:1 to a fixed Agent
  Zero ctxID, with ASR, prompt, assistant response, and authoritative TTS audio
  routed through Wyoming event streams. The retired custom Voqualizer WebSocket
  protocol is not a compatibility target.
version: 0.2.0
settings_sections:
  - agent
per_project_config: false
per_agent_config: false
always_enabled: false
