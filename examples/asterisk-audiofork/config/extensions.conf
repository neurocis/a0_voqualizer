; A0 Voqualizer Asterisk AudioSocket sample dialplan
;
; Include this context from your inbound routing or dial extension 7000 from a
; local test endpoint. AudioSocket forks signed-linear call audio to the bridge.

[voqualizer-demo]
exten => 7000,1,NoOp(A0 Voqualizer AudioSocket demo)
 same => n,Answer()
 same => n,Set(VOQ_CALL_ID=${UNIQUEID})
 same => n,AudioSocket(${VOQ_CALL_ID},127.0.0.1:9092)
 same => n,Hangup()
