; Minimal local PJSIP endpoint example for dialing the voqualizer-demo context.

[voqualizer-transport]
type=transport
protocol=udp
bind=0.0.0.0

[7000]
type=endpoint
context=voqualizer-demo
disallow=all
allow=slin,ulaw,alaw
auth=7000-auth
aors=7000

[7000-auth]
type=auth
auth_type=userpass
username=7000
password=change-me

[7000]
type=aor
max_contacts=1
