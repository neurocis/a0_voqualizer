; A0 Voqualizer AudioSocket bridge sample
;
; The bridge.py sample listens on 127.0.0.1:9092 by default in production wiring.
; Asterisk's AudioSocket application connects to that host:port from dialplan.

[general]
enabled = yes

[voqualizer-bridge]
type = client
host = 127.0.0.1
port = 9092
format = slin
rate = 8000
